name: 'Test Application/service API tests'
description: 'Test python API tests'
inputs:
  environment:
    description: 'environment where to run python API tests'
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        set-safe-directory: 'false'
        repository: 'mtararujs/course-js-api-framework'
        clean: 'false'
        path: 'mybuild'
    - run: echo "Testing Python Application service has started on ${{inputs.environment}} environment.."
      shell: powershell
    - name: Install all dependencies
      working-directory: ./mybuild
      run: npm install
      shell: powershell
    - name: Running API tests
      working-directory: ./mybuild
      shell: cmd
      run: npm run greetings greetings_${{inputs.environment}}
    - run: echo "Testing Python Application service finished"
      shell: powershell