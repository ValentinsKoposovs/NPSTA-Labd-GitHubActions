name: 'Build Application/service'
description: 'Build python service'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        repository: 'https://github.com/mtararujs/python-greetings.git'
        clean: 'false'
        path: 'mybuild'
    - run: echo "Installing all necessary node dependencies.."
      shell: powershell
    - run: python -m venv venv
      shell: cmd
      working-directory: ./mybuild
    - run: venv/Scripts/activate
      shell: cmd
      working-directory: ./mybuild
    - run: python -m pip install -r requirements.txt
      shell: cmd
      working-directory: ./mybuild
    - run: echo "Dependencies successfully installed"
      shell: powershell